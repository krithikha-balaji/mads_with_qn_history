<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multi-Agent Debate System</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#07111f;color:#e8eef7}
.container{max-width:1200px;margin:auto;padding:32px 20px}.hero{text-align:center;margin-bottom:28px}
.badge{display:inline-block;padding:7px 13px;border:1px solid #29415f;border-radius:999px;color:#7dd3fc;background:#0b1b2e;font-size:12px;font-weight:700;letter-spacing:.08em}
h1{font-size:42px;margin:16px 0 8px}.sub{color:#91a4ba}.inputbox,.card{background:#0c1929;border:1px solid #233a54;border-radius:16px}
.inputbox{padding:20px}.history-panel{margin-top:22px;background:#0c1929;border:1px solid #233a54;border-radius:16px;padding:18px}.history-list{display:grid;gap:8px}.history-item{display:flex;gap:10px;align-items:center;justify-content:space-between;background:#07111f;border:1px solid #233a54;border-radius:10px;padding:10px 12px}.history-question{color:#d9e3ef;cursor:pointer;flex:1;overflow-wrap:anywhere}.history-actions{display:flex;gap:6px;align-items:center}.history-actions button,.history-clear{margin-top:0;padding:8px 10px;font-size:12px}.history-clear{background:#26384b;color:#e8eef7}.history-delete{background:#48242c;color:#ffd7dc}.history-empty{color:#91a4ba;font-size:14px;padding:8px 0}textarea{width:100%;min-height:110px;background:#07111f;color:#fff;border:1px solid #304964;border-radius:12px;padding:15px;font-size:16px;resize:vertical}
button{margin-top:14px;background:#38bdf8;color:#04111d;border:0;border-radius:10px;padding:13px 22px;font-weight:800;cursor:pointer}button:disabled{opacity:.5}
.status{margin-top:12px;color:#9fb1c5;min-height:20px}section{margin-top:30px}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h2{font-size:20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{padding:18px}
.agent{font-weight:800;color:#7dd3fc}.label{font-size:11px;text-transform:uppercase;color:#71869e;letter-spacing:.08em;margin-top:14px}.text{line-height:1.55;color:#d9e3ef}
.pill{display:inline-block;margin-top:12px;padding:5px 9px;border-radius:8px;background:#12263b;color:#bfe8ff;font-size:12px}
.bar{height:8px;background:#172a3e;border-radius:99px;overflow:hidden;margin-top:8px}.fill{height:100%;background:#38bdf8}
.score{display:flex;justify-content:space-between;margin-top:8px;color:#b8c7d8}.final{border-color:#3b82f6;background:#0b1d31}.final-answer{font-size:21px;line-height:1.55;font-weight:700}
@media(max-width:750px){h1{font-size:32px}.grid{grid-template-columns:1fr}.container{padding:22px 14px}}
</style>
</head>
<body>
<main class="container">
<div class="hero"><span class="badge">MULTI-AGENT ORCHESTRATION</span><h1>Multi-Agent Debate System</h1><div class="sub">Six specialized agents • debate • consensus • final answer</div></div>
<div class="inputbox">
<textarea id="question" placeholder="Enter any question for the agents to debate..."></textarea>
<button id="start">Start Debate</button><div id="status" class="status"></div>
</div>
<section class="history-panel">
  <div class="section-title"><h2>Question History</h2><button id="clearHistory" class="history-clear" type="button">Clear history</button></div>
  <div id="historyList" class="history-list"><div class="history-empty">Your completed debates will appear here.</div></div>
</section>
<div id="results"></div>
</main>
<script>
const $=id=>document.getElementById(id);
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function arr(a){return (a||[]).map(x=>"<li>"+esc(x)+"</li>").join("")}
function render(d){
let h="<section><div class='section-title'><h2>1. Independent Agent Proposals</h2><span class='pill'>6 agents</span></div><div class='grid'>";
d.proposals.forEach(p=>h+=`<div class='card'><div class='agent'>${esc(p.agent)}</div><div class='label'>Proposal</div><div class='text'>${esc(p.proposal)}</div><div class='label'>Arguments</div><ul class='text'>${arr(p.arguments)}</ul><div class='label'>Justification</div><div class='text'>${esc(p.justification)}</div><span class='pill'>Confidence: ${p.confidence}%</span></div>`);
h+="</div></section><section><div class='section-title'><h2>2. Debate Engine</h2><span class='pill'>Critique + Counterargument + Revision</span></div><div class='grid'>";
d.critiques.forEach(c=>h+=`<div class='card'><div class='agent'>${esc(c.agent)}</div><div class='label'>Strong arguments</div><ul class='text'>${arr(c.strong_arguments)}</ul><div class='label'>Criticisms</div><ul class='text'>${arr(c.criticisms)}</ul><div class='label'>Counterarguments</div><ul class='text'>${arr(c.counterarguments)}</ul><div class='label'>Revised position</div><div class='text'>${esc(c.revised_position)}</div><span class='pill'>Confidence: ${c.confidence}%</span></div>`);
h+="</div></section><section><div class='section-title'><h2>3. Consensus Engine</h2></div><div class='grid'>";
d.scores.forEach(s=>h+=`<div class='card'><div class='agent'>${esc(s.agent)}</div><div class='score'><span>Consensus score</span><b>${s.consensus_score}</b></div><div class='bar'><div class='fill' style='width:${Math.min(100,s.consensus_score)}%'></div></div><div class='score'><span>Argument quality</span><span>${s.argument_quality}</span></div><div class='score'><span>Agent confidence</span><span>${s.agent_confidence}%</span></div></div>`);
h+=`</div></section><section><div class='section-title'><h2>4. Final Answer</h2></div><div class='card final'><div class='label'>Definite answer</div><div class='final-answer'>${esc(d.final.final_answer)}</div><div class='label'>Why this answer was selected</div><ul class='text'>${arr(d.final.justification)}</ul><div class='label'>Selected arguments</div><ul class='text'>${arr(d.final.selected_arguments)}</ul><div class='label'>Major criticisms considered</div><ul class='text'>${arr(d.final.major_criticisms_considered)}</ul><div class='label'>Consensus result</div><div class='text'>${esc(d.final.consensus_result)}</div><span class='pill'>Overall confidence: ${d.final.overall_confidence}%</span></div></section>`;
$("results").innerHTML=h}
const HISTORY_KEY="mads_question_history_v1";
function getHistory(){
  try { const value=JSON.parse(localStorage.getItem(HISTORY_KEY)||"[]"); return Array.isArray(value)?value:[]; }
  catch { return []; }
}
function saveHistory(question,data){
  const history=getHistory();
  history.unshift({id:Date.now().toString()+"-"+Math.random().toString(36).slice(2,8),question,createdAt:new Date().toISOString(),data});
  // Keep the most recent 30 debates to avoid unbounded browser storage.
  localStorage.setItem(HISTORY_KEY,JSON.stringify(history.slice(0,30)));
  renderHistory();
}
function renderHistory(){
  const history=getHistory();
  const list=$("historyList");
  if(!history.length){list.innerHTML="<div class='history-empty'>No saved questions yet. Complete a debate to add it here.</div>";return;}
  list.innerHTML=history.map(item=>{
    const date=new Date(item.createdAt);
    const stamp=Number.isNaN(date.getTime())?"":date.toLocaleString();
    return `<div class="history-item"><div class="history-question" role="button" tabindex="0" data-open="${esc(item.id)}"><div>${esc(item.question)}</div><small class="sub">${esc(stamp)}</small></div><div class="history-actions"><button type="button" data-open="${esc(item.id)}">View</button><button type="button" class="history-delete" data-delete="${esc(item.id)}">Delete</button></div></div>`;
  }).join("");
}
function openHistoryItem(id){
  const item=getHistory().find(x=>x.id===id);
  if(!item)return;
  $("question").value=item.question;
  render(item.data);
  $("status").textContent="Loaded a saved debate from question history.";
  $("results").scrollIntoView({behavior:"smooth",block:"start"});
}
$("historyList").addEventListener("click",e=>{
  const open=e.target.closest("[data-open]");
  const del=e.target.closest("[data-delete]");
  if(open)openHistoryItem(open.dataset.open);
  if(del){localStorage.setItem(HISTORY_KEY,JSON.stringify(getHistory().filter(x=>x.id!==del.dataset.delete)));renderHistory();}
});
$("historyList").addEventListener("keydown",e=>{
  if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-open]")){e.preventDefault();openHistoryItem(e.target.dataset.open);}
});
$("clearHistory").addEventListener("click",()=>{
  if(!getHistory().length)return;
  if(confirm("Clear all saved question history? This cannot be undone.")){localStorage.removeItem(HISTORY_KEY);renderHistory();}
});
renderHistory();
$("start").addEventListener("click",async()=>{
const q=$("question").value.trim();if(!q){$("status").textContent="Please enter a question.";return}
$("start").disabled=true;$("results").innerHTML="";$("status").textContent="Six agents are analyzing and debating...";
try{const r=await fetch("http://127.0.0.1:8000/api/debate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q})});
const d=await r.json();if(!r.ok)throw Error(d.detail||"Server error");$("status").textContent="Debate complete — final consensus generated.";render(d);try{saveHistory(q,d)}catch(e){$("status").textContent="Debate complete, but this browser could not save history. Check browser storage settings.";}}
catch(e){$("status").textContent="Error: "+e.message}finally{$("start").disabled=false}});
</script>
</body>
</html>
